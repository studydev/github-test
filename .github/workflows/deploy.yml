name: deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 21 * * *"   # UTC 21:00 = 한국 시간 매일 06:00
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 공공 관광 데이터 받기
        run: node scripts/fetch-places.js
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
      - name: 데이터 검사
        run: node scripts/check-data.js
      - name: 공개할 파일 모으기
        run: mkdir -p _site && cp -r index.html style.css app.js data _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
